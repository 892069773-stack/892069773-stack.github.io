          archiveName: "未来鹅-AI成长陪伴平台方案.pdf",

          lead: "为尊重推荐人隐私，公开站不直接托管教授签字原件，面试交流时可按需提供。",
          archive: "contact.html",
          archiveName: "李宗谦-教授推荐信.pdf",
          base64: "",
          back: "reference.html"
        }
      };

      const params = new URLSearchParams(window.location.search);
      const doc = docs[params.get("id")] || docs.cv;
      const title = document.querySelector("[data-doc-title]");
      const lead = document.querySelector("[data-doc-lead]");
      const status = document.querySelector("[data-status]");
      const directLink = document.querySelector("[data-direct-download]");
      const backLink = document.querySelector("[data-back-link]");

      title.textContent = doc.title;
      lead.textContent = doc.lead;
      directLink.href = doc.archive;
      directLink.download = doc.archiveName;
      if (doc.native) {
        delete directLink.dataset.pdfDownload;
        delete directLink.dataset.pdfBase64;
        directLink.dataset.nativeDownload = "true";
      } else if (doc.base64) {
        delete directLink.dataset.nativeDownload;
        directLink.dataset.pdfBase64 = doc.base64;
        directLink.dataset.pdfDownload = "true";
      } else {
        delete directLink.dataset.nativeDownload;
        delete directLink.dataset.pdfBase64;
        directLink.dataset.pdfDownload = "true";
      }
      backLink.href = doc.back;
      status.textContent = "PDF 已就绪。微信里没反应的话，用右上角在浏览器打开。";
